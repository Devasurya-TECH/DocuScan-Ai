services:
  # ── Web Service: Django API + React frontend served by Gunicorn ────────────
  - type: web
    name: docuscan-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore        # Options: singapore, oregon, ohio, frankfurt
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true  # Render generates a secure random value automatically
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CELERY_ALWAYS_EAGER
        value: "True"
      - key: CELERY_BROKER_URL
        value: "memory://"
      - key: CELERY_RESULT_BACKEND
        value: "cache+memory://"
      - key: OCR_DEFAULT_ENGINE
        value: "tesseract"
      - key: OCR_LANGUAGES
        value: "en,hi"
      - key: OCR_DEVICE
        value: "cpu"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://docu-scan-ai-sigma.vercel.app"
      - key: PORT
        value: "8000"
