services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 300"
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=production-secure-key-change-in-env
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CELERY_ALWAYS_EAGER=False
      - DATABASE_URL=postgres://docuscan:docuscan_secure_pass@postgres:5432/docuscan_db
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - media_volume:/app/backend/media

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A config worker -l INFO --concurrency=2
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=production-secure-key-change-in-env
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CELERY_ALWAYS_EAGER=False
      - DATABASE_URL=postgres://docuscan:docuscan_secure_pass@postgres:5432/docuscan_db
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - media_volume:/app/backend/media

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=docuscan_db
      - POSTGRES_USER=docuscan
      - POSTGRES_PASSWORD=docuscan_secure_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuscan -d docuscan_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  media_volume:
  pgdata:
